<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lazyspotter</title>
<link rel="stylesheet" href="style.css?v=2.4.1">
</head>
<body>
<header id="bar">
  <span class="brand"><img src="breaking_carbon.jpg" alt="Breaking Carbon" height="32">lazyspotter<span id="ver" class="ver"></span></span>
  <nav id="modes">
    <button data-mode="race">Race</button>
    <button data-mode="learn">Learn · auto</button>
    <button data-mode="manual">Learn · manual</button>
    <button data-mode="live">Live</button>
  </nav>
  <label>Track <select id="trackSel"></select></label>
  <button id="newTrack" title="Create a track folder">＋</button>
  <label>Video <select id="videoSel"></select></label>
  <button id="addVideo" title="Upload a video from this device and analyse it against a track">⬆ Add video</button>
  <span id="actions"></span>
  <span class="grow"></span>
  <div class="menu">
    <button id="winBtn">Windows ▾</button>
    <div id="winMenu" class="dropdown"></div>
  </div>
  <img class="partner" src="race_drones.svg" alt="Race Drones" title="Race Drones" width="34" height="36">
</header>
<main id="desk"></main>
<footer id="status">Loading…</footer>
<div id="uploader" class="modal">
  <div class="dlg">
    <div class="dlg-h"><b>Upload a video</b><span class="x" id="upClose">✕</span></div>
    <div class="row">Track <select id="upTrack"></select></div>
    <div class="row" id="upRoleRow">Add as
      <label><input type="radio" name="upRole" value="race" checked> race video (analysed right away)</label>
      <label><input type="radio" name="upRole" value="learn"> learn video</label></div>
    <div class="hint">Pick the track your video was flown on: its passes are labelled against that track's learned gates.
      Analysis takes a few minutes and runs one video at a time.</div>
    <div class="hint" id="upLimits"></div>
    <div class="row"><input type="file" accept="video/*,.mp4,.mov,.mkv,.avi" id="upFile"></div>
    <div class="row"><progress id="upProg" max="100" value="0" style="flex:1"></progress><span id="upMsg" class="hint"></span></div>
    <div class="row"><span class="grow"></span><button class="primary" id="upGo">Upload</button></div>
  </div>
</div>
<script src="app.js?v=2.4.1"></script>
</body>
</html>
