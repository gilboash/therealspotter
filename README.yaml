# FPV therealspotter  🏁
**Vision-based FPV race analysis, gate learning, and lap timing**

therealspotter / lazyspotter is a **computer-vision tool for FPV drone racing** that detects gates from video, identifies gate passes, learns track layouts, and produces **lap timing and gate-to-gate performance statistics**.

Designed for:
- FPV pilots who want to analyze race footage
- Track builders who want automatic gate ordering
- Dataset creation and model training
- Research and experimentation in vision-based racing analytics

All processing runs **locally** (no cloud), written entirely in **Python**.

YT video demonstration: https://www.youtube.com/watch?v=6A2gmpzc6iU

---

## 🌐 Web app (`spotter_web.py`) — start here

### Launch

```bash
# once: Python 3.11 venv with the requirements (install torch for your hardware first, see requirements.txt)
python3 -m venv venv
./venv/bin/pip install -r requirements.txt

# once: tell the code where the dataset lives (or set $FPV_DATA_ROOT)
echo '{"data_root": "/path/to/FPVdatasets"}' > local_config.json

./venv/bin/python spotter_web.py                      # this computer only, opens http://127.0.0.1:8770
./venv/bin/python spotter_web.py --lan --no-browser   # also phones / other computers: http://<this computer's IP>:8770
./venv/bin/python spotter_web.py --port 8780          # another port
```

What it needs on disk:
- `cyn_current-20260715_best.pt` next to the code (the YOLO gate detector the pass scorer was trained with; in the repo);
- `<FPVdatasets>/training/pass_scorer.json` (the pass scorer, `python pass_scorer.py track1 --save`);
- one folder per track in `<FPVdatasets>/` (created from the web app with **＋**), see *Dataset layout* below.

**From outside the network** (e.g. a phone on mobile data), a Cloudflare quick tunnel gives a temporary public
https URL, with no account: start the app with `--lan`, then

```bash
cloudflared tunnel --url http://localhost:8770     # prints https://<random>.trycloudflare.com
```

Anyone with that URL can use the app (and its data folder) while the tunnel runs; stop it with Ctrl+C.

### League page — sharing with pilots

Run a second, locked-down server for the pilots and tunnel only that one (keep your own on 8770, not tunnelled):

```bash
./venv/bin/python spotter_web.py --lan --no-browser --league --port 8780 --tracks fril-26-race-7,fril-27-first-track
cloudflared tunnel --url http://localhost:8780
```

- `--tracks` lists the track folders to serve (any others, e.g. a test track, are hidden; works without `--league` too).
- Pilots get **Race** mode only. The video list holds the race videos you analysed, plus their own uploads.
- **⬆ Upload your video** opens a picker on *their* device. They choose the
  matching track; the video is uploaded in 32 MB chunks (a Cloudflare tunnel refuses requests over 100 MB) under
  a new name if one exists, and analysed right away. Jobs run one at a time per server.
- Refused on the league page (HTTP 403): learning, marks, reset learning, removing videos, creating tracks,
  re-analysing an analysed video, and cancelling jobs. Job logs
  show `<data>` / `<app>` instead of this computer's paths.
- Uploads land in the track's `test_videos/`, so they show for everyone on the page (and in your own app).
  Runs you analyse in your own app appear on the league page too (it refreshes its list every minute).
- Upload limits: 1 GB per video, 2 uploads per hour per pilot (by internet address), and uploads pause once
  pilots' videos still in the tracks total 10 GB (removing some in your app frees room). Uploads are recorded
  in `<FPVdatasets>/league_uploads.json`; abandoned partial uploads are deleted after an hour.
- After an upload the analysis starts by itself; if it couldn't, the video shows **▶ Run analysis**.

### Modes

A local Python server runs the pipeline; the UI is in the browser. Four modes, each with its own floating windows
(drag, resize, close, reopen from **Windows ▾**; the layout is remembered per mode):

| Mode | What you do | Windows |
|---|---|---|
| **Race** | pick a track and a video → **▶ Run analysis** (YOLO on the Mac GPU, ~1.5–3 min for a 2 min video) | Video (track boxes coloured idle / aligned / passed, lap timer, spotter flags), Timeline, Race stats, Gate splits (time between gates, every lap, best section highlighted), Pass detector · tracks, Detections, Passes |
| **Learn · auto** | add learn videos, type the number of gates → **🎓 Learn track** | Videos, Learn track, Gates (learned images), Jobs |
| **Learn · manual** | play a video, press `L` at the start gate, `G` at each next gate, `L` at every lap end → **Learn track from marks** | Video, Timeline, Manual marks, Gates, Passes |
| **Live** | pick a feed (a video file played in real time, a capture device or a stream URL) → **▶ Start**; a sound per gate pass; with a learned track, gate names, laps and lap times spoken | Live feed, Live — laps, Live — gate log |

**⬆ Add video** (both pages) uploads from the device the page is open on, through the browser's own file picker; the
server never browses or copies its own folders, so the page is safe to open to others. Choose the track and, on your
own page, race or learn video. A race video is analysed right away. A file the track already has (same name and
size) isn't uploaded again: it is opened, and if it is already analysed you're asked whether to run the analysis
again over it (the same question as **▶ Re-run analysis**).

Keys: `Space` play/pause · `←/→` ±1 s · `Shift+←/→` ±10 s · `↑/↓` ±1 frame. Learning re-labels every analysed
race video of the track (seconds, no YOLO). The URL keeps the mode, track and video (`#mode=race&track=…&video=…`).
Analysis and learning run as background jobs, one at a time (Jobs window: progress, log, cancel).

- **Learn · auto** uses `learn_track.py` (first-lap template + EM, see below). The first gate passed in every learn
  video is G1. If a video's start is messy, open it in **Learn · manual** and press `L` at every start/finish
  crossing (no other marks needed): those G1 times pin the laps of that video the next time you learn.
- **Learn · manual** learns the gates from the marks alone (`lap_learner.points_from_marks`); labelling then uses
  the same sequence decoder.
- **Reset learning** moves the learned files to `<track>/learn_backups/<time>/` (the YOLO analyses stay);
  **✕** on a video moves it to `<track>/removed_videos/` (its analysis in `runs/` stays).
- **Spotter flags** (Race mode): a lap that skipped a gate is flagged red (🚩 *missed G4*); a lap completed with a
  recovered gate (a weak crossing, see `near_miss.py` below) is flagged amber (🟠 *recovered G11*), and the pass
  shows as `G11 ?`. Both mean "a spotter should check this lap".

### How a race video is labelled

1. `extract_race.py`: YOLO + tracker per frame, `pass_scorer.py` decides the passes after the fact, CLIP image of each.
2. `near_miss.py`: the scorer's crossings that were *just* below its threshold (p 0.10–0.35, leaving through the
   frame edge) are added, without an image.
3. `gate_decoder.py`: all passes of the video are labelled at once by order + the track's learned timing + appearance.
4. An added crossing that repeats a gate its lap already has is dropped; the ones kept are marked `recovered`.
5. Laps run G1 to G1. `relabel_run.py` repeats steps 2–4 on a saved analysis in seconds (used after every learn).

### Live — the real-time spotter (`online_spotter.py`, `online_decoder.py`)

Spotting while the drone flies, on one feed, on the Mac.
- **Stage 1:** YOLO + tracker + the live `PassDetector`; every gate pass is an event the moment it's detected.
- **Stage 2** (the track in the top bar is learned): each pass is named G1…GN and laps are timed G1 to G1, the first
  G1 pass starting lap 1. Sounds: a **beep** on every detected pass, an arcade **coin** ~0.1 s later when the gate is
  named, a **fanfare** on the start gate; the voice says "Go!" at the first G1 and every lap time ("Niv, lap 3, 29.6,
  best lap"; the pilot name is typed in for a capture device or stream). The laps window explains the sounds.
- **Laps** (Live feed bar): *learned track* (the track in the top bar; picked automatically when it's learned) or
  *off* (beeps only). With **— none —** or an unlearned track in the top bar it's off. A rough *auto* mode (only the
  number of gates, the first pass taken as the start gate) was tried and dropped: counting passes isn't accurate
  enough to find the start gate again (lap count right in 31 of 47 replayed races, lap times off by ~2 s).
- A file at ×2 makes the detector drop ~35% of the frames and lose most passes: use ×1.

- **Feeds:** a video file of the track (top bar) played at real-time pace, ×0.5 / ×1 / ×2 · a capture device
  (USB / HDMI card; the Mac asks once for camera permission for the terminal running the server) · a stream URL:
  RTSP (e.g. the media box, `rtsp://naco.local:8554/…`) or MJPEG over HTTP.
- **Keeps up with real time:** a reader thread keeps only the newest frame; frames the spotter can't take in time
  are dropped and counted, never queued, so the delay can't grow.
- The server runs it in-process and sends the page every pass the moment it's detected (server-sent events,
  `/api/live/events`) and the feed with the tracked gates (MJPEG, `/api/live/mjpeg`). The tone plays in the page, so
  it comes from whatever device the page is open on. The browser allows sound only after a click on the page:
  **▶ Start** (or **test**) does that. One feed at a time; Live isn't available on the league page.
- **Detector size** (det 320 / 416 / 640): 416 by default. The offline analysis uses 640, which can't keep up at
  30 fps on an M2 next to the rest.

**Measured** (MacBook Pro M2, h007_R3_Storm, 136 s at 30 fps, played in real time; passes matched within ±0.35 s
to the video's offline analysis — its final passes and its live detector at full size, every frame):

| Detector size | fps analysed | Frames dropped | Processing delay (median / 95%) | vs offline final passes (56) | vs offline live detector (57) |
|---|---|---|---|---|---|
| 640, every frame (`--fast`, not real time) | — | 0 | — | 54 found, 2 missed, 3 extra | 57 found, identical |
| 320 | ~30 | 0.5% | 34 / 50 ms | 53 found, 3 missed, 5 extra | 53 found, 4 missed, 5 extra |
| **416** (default) | ~30 | 0.8% | 30 / 48 ms | 52 found, 4 missed, 3 extra | 53 found, 4 missed, 2 extra |
| 640 | ~21 | 28% | 62 / 112 ms | 24 found, 32 missed, 2 extra | 26 found, 31 missed |

**The spotter must analyse every frame: a smaller detector is fine, dropping frames is not.** At 640 it can't keep
up, drops 28% of the frames, and finds half the passes. The tracker forgets a gate after 0.06 s without a detection
(`ttl_seconds`) and the pass detector counts a gate gone for 0.06 s as passed (`disappear_timeout`), both tuned for
every frame at 30 fps, so one dropped frame (a 0.067 s gap) already breaks a track. A drop rate above a few percent
is shown in orange on the Live page.

The pass detector fires ~0.1 s after the gate (when the gate has left the frame); add the processing delay, and
~0.1–0.2 s of network for a stream, for the time from the pass to the tone.

**Naming gates live (`online_decoder.py`).** The offline sequence decoder (`gate_decoder.py`) labels a video
looking at every pass before *and after*; live, a pass has to be named from the passes before it. `OnlineDecoder`
runs the same dynamic program (order + the track's learned gate-to-gate timing + CLIP of the gate, the first pass
likely G1) one pass at a time: a new pass adds one column and gets the gate of the best path ending on it, or is
called not a pass (✕ in the gate log) when the best path ends earlier. The pilot's speed is re-estimated after
every pass. A lap ends at G1 once half the gates have been flown; if G1 itself was missed, at the first gate after
the order wraps, with the G1 time estimated from the learned timing (shown with **~**). CLIP runs on the CPU in a
second thread: on the GPU next to YOLO it made the detector drop 4% of the frames instead of ~1%. A gate is named
~90 ms after its pass.

**Measured** — `python online_decoder.py <track>` replays the live detector's passes of every analysed video one at a
time and compares with the offline result (47 videos of fril-26-race-7 and fril-27-first-track, 138 laps):

| | |
|---|---|
| Gate names, same as the offline labels | 85.5% (offline itself, deciding at the end: 92.9%) |
| Laps with the right time (±0.3 s of offline) | 114 / 138 (83%); lap time error median 0 ms |
| Start gate crossings named G1 | 158 / 179 (19 passes wrongly called G1) |
| Lap 1 started at the right pass | 40 / 47 videos |

Of the 24 laps missed, 6 are start-gate crossings the live detector never sees; the rest are passes named wrongly.
What didn't help: waiting for 1–2 more passes before naming (gate names 89–90%, but G1 only 158 → 162 of 179, and
call-outs would come ~3 s late); the whole-frame *scene* of the start gate as an extra cue (114 → 116 laps, a second
CLIP per pass); other decoder settings (the offline defaults were best).

Real time through the web app, Storm at det 416: lap 1 started at the right pass, laps 36.57 / 32.69 ~ / … vs
36.53 / 32.83 offline (in that run G1 of lap 2 was missed and estimated).

```bash
python online_spotter.py "<FPVdatasets>/fril-27-first-track/test_videos/h007_R3_Storm.mp4" --compare   # real time, vs offline (+ gate names / laps)
python online_decoder.py fril-27-first-track -v                  # replay the analysed videos through the online decoder
python online_spotter.py <video> --fast --imgsz 640 --compare     # every frame: must match the offline live detector
python online_spotter.py 0                                       # capture device 0
python online_spotter.py rtsp://naco.local:8554/<path>           # a stream
```

## 🧪 Test dataset collection

**Collecting a scored test dataset comes before changing detection** (built on branch `dataset/real-video-marking`).
Before we change the pass detector or the gate matching, we need ground truth to measure them against: for real race videos, every real gate pass with its exact time and gate ID. These tools collect and store that data and score the current system against it. They don't change how passes are detected or matched.

What it adds:
- **One dataset folder outside the repo, one folder per track** (`dataset_paths.py`). Every UI and script reads from and saves to it, so no data files are written into the repo.
- **REVIEW mode in `learn_ui.py`.** The current system pre-fills every pass on a test video. You confirm or fix each one with the keyboard and add what it missed. The result is saved as `<video>.gt.json`. Review never changes the gate memory.
- **Every file made from a video starts with the video's name**, so one video's data sorts together.

### Dataset layout

```
FPVdatasets/                         default: /Users/eyalcozac/Codes and apps/FPVdatasets
  <track>/                           one folder per track, e.g. track1
    gate_memory.json                 the track's learned gates (learn_ui, DEFINE/ADD)
    memory_videos/                   videos the gates are learned from
    test_videos/                     videos used only for scoring
    candidates/<video>.candidates.json   + <video>.crops/          (learn_ui extraction)
    runs/<video>.race_data.json          + <video>.race_query/     (extract_race.py)
    gt/<video>.gt.json               reviewed ground truth (learn_ui REVIEW)
    velocidrone/                     the sim version of the same track, same layout
  training/                          shared YOLO data: gate_annotations/, gate_models/, runs/
```

The data root is taken from `$FPV_DATA_ROOT`, then `data_root` in a local `local_config.json` next to the code, then the default above. Paths inside the dataset are stored relative to the root, so the folder can be moved. Keep the videos used for learning a track out of `test_videos/`, so the gate-ID scores aren't inflated by videos the memory has already seen.

### How to collect data for a track

1. `python learn_ui.py` → **📁 Open Track** → pick or create `FPVdatasets/<track>`.
2. **Learn the gates** (if the track has no `gate_memory.json` yet): Open Video → a video from `memory_videos/` → mark gates (L / G, see below) → more memory videos in ADD mode → **S** saves `<track>/gate_memory.json`.
3. **Review test videos**: **🔍 Review Video** → a video from `test_videos/`. If `runs/<video>.race_data.json` is missing, the current system runs on the video first (progress bar). Then go through every pass:

| Key | Action |
|---|---|
| `N` / `Shift+N` | next / previous pass still to review |
| `0`–`9` | gate ID for the selected pass (`1` `2` quickly → G12); clicking a gate in Gate Order does the same |
| `Enter` | accept at the playhead and go to the next pass |
| `↑` / `↓` | move one frame first, to fix the exact pass frame |
| `X` | not a real pass (false pass) |
| `A` | add a pass the detector missed, at the playhead |
| `M` | mark a gate the pilot skipped, at the playhead |
| `T` | tag: crash/clipped → bad video → unsure → none |
| `Backspace` | undo the review of the selected pass (deletes added ones) |
| `S` / `Cmd+S` | save now (also saved after every change) |

A video picked from outside the dataset is copied into the open track first. Reopening a reviewed video continues from its `gt.json`.

**Pass rule:** a clipped gate counts as a pass if the drone went through it. A crash in the gate counts only if the drone flies on.

### What a `<video>.gt.json` holds

For every real pass: time and frame, gate ID and type, lap, tag, and the verdict (`accepted`, `fixed_id`, `added` = detector missed it, `skipped` = pilot missed the gate). It also records whether the time was adjusted, the detector's original prediction (time, gate, CLIP similarity, pass reason, track ID), and the tracker box at the pass frame (`track_at_pass`). Detector passes that weren't real are listed in `false_passes`. Together these give pass-detection recall and precision, timing error and gate-ID accuracy, without rerunning YOLO.

### Scoring — `score.py`

Compares `runs/<video>.race_data.json` with `gt/<video>.gt.json` for every track and prints, per video and per track, with real and Velocidrone tracks totalled separately:

- **Pass detection:** a detector pass within ±0.15 s of a real pass is *on time*. Within ±0.5 s it's *off-time*: it fired for that gate, but at the wrong moment, so it isn't counted as a miss plus a false pass. Also reports recall, precision and timing error.
- **Gate ID** on every real pass the detector fired for. Videos in `memory_videos/` are left out.
- **Laps**, **skipped gates** marked, and results **per tag**. Marks tagged *unsure* are left out of all scores.

```bash
python score.py                       # all tracks, gate IDs as saved in runs/
python score.py track1 --rematch      # redo gate matching with the current gate_memory.json (no YOLO, seconds)
python score.py --list                # also list every missed / off-time / false pass and wrong gate, with times
python score.py --rematch --save baseline   # write <FPVdatasets>/scores/<date>_baseline.json
```

### Baseline (track1, `score.py --rematch`, 4 test videos + 1 memory video)

| | Current system |
|---|---|
| Pass recall | 186 / 213 on time (87%), 196 / 213 including 10 off-time (92%), 17 missed |
| Pass precision | 196 / 205 detector passes were real (96%) |
| Pass timing | median 0 ms, 90% within 67 ms |
| Gate ID | 8 / 173 correct (5%); a gate was given on 17%, and was right on 27% of those |
| CLIP most-similar gate | right on 64 / 173 (37%), with no gate order and no threshold |
| Laps | 4 found / 15 marked |

Pass detection is already usable. Telling gates apart by appearance alone is the weak point, so the next steps are the pass detector's misses and off-time passes, and using gate order (`docs/PLAN.md`, Milestone 2).

