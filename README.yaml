# FPV therealspotter  🏁
**Vision-based FPV race analysis, gate learning, and lap timing**

therealspotter / lazyspotter is a **computer-vision tool for FPV drone racing** that detects gates from video, identifies gate passes, learns track layouts, and produces **lap timing and gate-to-gate performance statistics**.

Designed for:
- FPV pilots who want to analyze race footage
- Track builders who want automatic gate ordering
- Dataset creation and model training
- Research and experimentation in vision-based racing analytics

All processing runs **locally** (no cloud), written entirely in **Python**.

YT video demonstration: https://www.youtube.com/watch?v=6A2gmpzc6iU

---

## 🌐 Web app (`spotter_web.py`) — start here

```bash
python spotter_web.py            # opens http://127.0.0.1:8770
python spotter_web.py --lan      # also reachable from other devices on the network
```

A local Python server runs the pipeline; the UI is in the browser. Three modes, each with its own floating windows
(drag, resize, close, reopen from **Windows ▾**; the layout is remembered per mode):

| Mode | What you do | Windows |
|---|---|---|
| **Race** | pick a track and a video → **▶ Run analysis** (YOLO on the Mac GPU, ~3 min for a 2 min video) | Video (track boxes coloured idle / aligned / passed, lap timer), Timeline, Race stats, Gate splits (time between gates, every lap, best section highlighted), Pass detector · tracks, Detections, Passes |
| **Learn · auto** | add learn videos, type the number of gates → **🎓 Learn track** | Videos, Learn track, Gates (learned images), Jobs |
| **Learn · manual** | play a video, press `L` at the start gate, `G` at each next gate, `L` at every lap end → **Learn track from marks** | Video, Timeline, Manual marks, Gates, Passes |

Keys: `Space` play/pause · `←/→` ±1 s · `Shift+←/→` ±10 s · `↑/↓` ±1 frame. Learning re-labels every analysed
race video of the track (seconds, no YOLO). The URL keeps the mode, track and video (`#mode=race&track=…&video=…`).

**Lap logic (`lap_learner.py`):** the first gate passed is the start/finish gate (G1), and only G1 closes a lap.
Learning lines the laps up against each other; the N most reliable pass points become the gates and the other
recurring detections are tracked as extras (E1, E2…; shown in blue, never counted). Labelling a race video finds
each G1 crossing by the gate sequence that follows it, so it also works for a video from another camera.

## 🧪 Test dataset collection

**Collecting a scored test dataset comes before changing detection** (built on branch `dataset/real-video-marking`).
Before we change the pass detector or the gate matching, we need ground truth to measure them against: for real race videos, every real gate pass with its exact time and gate ID. These tools collect and store that data and score the current system against it. They don't change how passes are detected or matched.

What it adds:
- **One dataset folder outside the repo, one folder per track** (`dataset_paths.py`). Every UI and script reads from and saves to it, so no data files are written into the repo.
- **REVIEW mode in `learn_ui.py`.** The current system pre-fills every pass on a test video. You confirm or fix each one with the keyboard and add what it missed. The result is saved as `<video>.gt.json`. Review never changes the gate memory.
- **Every file made from a video starts with the video's name**, so one video's data sorts together.

### Dataset layout

```
FPVdatasets/                         default: /Users/eyalcozac/Codes and apps/FPVdatasets
  <track>/                           one folder per track, e.g. track1
    gate_memory.json                 the track's learned gates (learn_ui, DEFINE/ADD)
    memory_videos/                   videos the gates are learned from
    test_videos/                     videos used only for scoring
    candidates/<video>.candidates.json   + <video>.crops/          (learn_ui extraction)
    runs/<video>.race_data.json          + <video>.race_query/     (extract_race.py)
    gt/<video>.gt.json               reviewed ground truth (learn_ui REVIEW)
    velocidrone/                     the sim version of the same track, same layout
  training/                          shared YOLO data: gate_annotations/, gate_models/, runs/
```

The data root is taken from `$FPV_DATA_ROOT`, then `data_root` in a local `local_config.json` next to the code, then the default above. Paths inside the dataset are stored relative to the root, so the folder can be moved. Keep the videos used for learning a track out of `test_videos/`, so the gate-ID scores aren't inflated by videos the memory has already seen.

### How to collect data for a track

1. `python learn_ui.py` → **📁 Open Track** → pick or create `FPVdatasets/<track>`.
2. **Learn the gates** (if the track has no `gate_memory.json` yet): Open Video → a video from `memory_videos/` → mark gates (L / G, see below) → more memory videos in ADD mode → **S** saves `<track>/gate_memory.json`.
3. **Review test videos**: **🔍 Review Video** → a video from `test_videos/`. If `runs/<video>.race_data.json` is missing, the current system runs on the video first (progress bar). Then go through every pass:

| Key | Action |
|---|---|
| `N` / `Shift+N` | next / previous pass still to review |
| `0`–`9` | gate ID for the selected pass (`1` `2` quickly → G12); clicking a gate in Gate Order does the same |
| `Enter` | accept at the playhead and go to the next pass |
| `↑` / `↓` | move one frame first, to fix the exact pass frame |
| `X` | not a real pass (false pass) |
| `A` | add a pass the detector missed, at the playhead |
| `M` | mark a gate the pilot skipped, at the playhead |
| `T` | tag: crash/clipped → bad video → unsure → none |
| `Backspace` | undo the review of the selected pass (deletes added ones) |
| `S` / `Cmd+S` | save now (also saved after every change) |

A video picked from outside the dataset is copied into the open track first. Reopening a reviewed video continues from its `gt.json`.

**Pass rule:** a clipped gate counts as a pass if the drone went through it. A crash in the gate counts only if the drone flies on.

### What a `<video>.gt.json` holds

For every real pass: time and frame, gate ID and type, lap, tag, and the verdict (`accepted`, `fixed_id`, `added` = detector missed it, `skipped` = pilot missed the gate). It also records whether the time was adjusted, the detector's original prediction (time, gate, CLIP similarity, pass reason, track ID), and the tracker box at the pass frame (`track_at_pass`). Detector passes that weren't real are listed in `false_passes`. Together these give pass-detection recall and precision, timing error and gate-ID accuracy, without rerunning YOLO.

### Scoring — `score.py`

Compares `runs/<video>.race_data.json` with `gt/<video>.gt.json` for every track and prints, per video and per track, with real and Velocidrone tracks totalled separately:

- **Pass detection:** a detector pass within ±0.15 s of a real pass is *on time*. Within ±0.5 s it's *off-time*: it fired for that gate, but at the wrong moment, so it isn't counted as a miss plus a false pass. Also reports recall, precision and timing error.
- **Gate ID** on every real pass the detector fired for. Videos in `memory_videos/` are left out.
- **Laps**, **skipped gates** marked, and results **per tag**. Marks tagged *unsure* are left out of all scores.

```bash
python score.py                       # all tracks, gate IDs as saved in runs/
python score.py track1 --rematch      # redo gate matching with the current gate_memory.json (no YOLO, seconds)
python score.py --list                # also list every missed / off-time / false pass and wrong gate, with times
python score.py --rematch --save baseline   # write <FPVdatasets>/scores/<date>_baseline.json
```

### Baseline (track1, `score.py --rematch`, 4 test videos + 1 memory video)

| | Current system |
|---|---|
| Pass recall | 186 / 213 on time (87%), 196 / 213 including 10 off-time (92%), 17 missed |
| Pass precision | 196 / 205 detector passes were real (96%) |
| Pass timing | median 0 ms, 90% within 67 ms |
| Gate ID | 8 / 173 correct (5%); a gate was given on 17%, and was right on 27% of those |
| CLIP most-similar gate | right on 64 / 173 (37%), with no gate order and no threshold |
| Laps | 4 found / 15 marked |

Pass detection is already usable. Telling gates apart by appearance alone is the weak point, so the next steps are the pass detector's misses and off-time passes, and using gate order (`docs/PLAN.md`, Milestone 2).

