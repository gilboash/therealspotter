## ⏱️ Compute benchmark (`perf_run.py`)

A rough speed reference to compare future versions and enhancements against. `perf_run.py` runs the full race
analysis exactly as the web app starts it (YOLO `cyn_current-20260715_best.pt`, CLIP on the GPU, pass scorer,
near-misses, sequence decoding) on a throw-away copy of the video's track, and times it by stage:

```bash
./venv/bin/python perf_run.py "<FPVdatasets>/fril-26-race-7/test_videos/Q8 Niv .mp4" --runs 2
./venv/bin/python perf_run.py "<FPVdatasets>/fril-27-first-track/test_videos/h007_R3_Storm.mp4" --runs 2
```

Run it with nothing else analysing (no web app jobs) and the laptop on power. The two videos are full race runs
where every lap has every gate.

**Machine:** MacBook Pro (Mac14,7), Apple M2 (8-core CPU: 4 performance + 4 efficiency; 10-core GPU, Metal 3),
16 GB memory, macOS 14.5. Python 3.11.4, torch 2.9.1 (MPS), ultralytics 8.3.241, OpenCV 4.8.1, open_clip 3.2.0.

**Results, version 2.1.1** (Oct 2026), on an idle Mac:

| Video | Length (frames @ 30 fps) | Frame loop | Post-processing | Total | Speed vs real time | Found |
|---|---|---|---|---|---|---|
| Q8 Niv (fril-26) | 144 s (4327) | 180 s · **24.0 fps** | 12 s | 196 s | 0.74× | 71 passes, 5 laps |
| h007_R3_Storm (fril-27) | 136 s (4079) | 174 s · **23.4 fps** | 12 s | 190 s | 0.72× | 58 passes, 4 laps |

- **Frame loop** = YOLO + tracker + optical-flow motion + CLIP at each pass, per frame; it is ~94% of the time.
  Startup (loading models) adds ~4 s.
- **Post-processing** = pass scorer, whole-frame scene embeddings, near-misses and gate labelling.
- **Re-labelling** a saved analysis (`relabel_run.py`, after every learn; no YOLO): ~1.9 s per video.
- Roughly: **a 2–2.5 min race video takes ~3.2 min to analyse** on this Mac, i.e. ~0.73× real time.
- **Anything else on the GPU slows it a lot.** Two more runs overlapped a pilot's league analysis: Storm fell to
  16.2 fps (268 s) with the whole run shared, Q8 Niv to 22.0 fps (216 s) with its last minute shared. With
  DaVinci Resolve open it ran at ~18 fps. Check `/api/jobs` on every server first.

**Where the time goes** (cProfile of a full Storm run, plus YOLO timed alone):

| Step | Share | Per frame | Notes |
|---|---|---|---|
| YOLO detection | ~80% | ~40 ms on the GPU | Network ~29 ms at 640×384 input, the rest is waiting for the GPU (NMS itself is ~0.3 ms). On the CPU it would be 136 ms (7 fps). |
| Loop bookkeeping | ~6% | ~4 ms | Per-frame track records, buffers (Python) |
| Optical-flow motion | ~4% | ~2 ms | Farneback, for the pass scorer |
| CLIP | ~3% | ~18 ms per crop | Only at passes and candidates (~390 crops per video) |
| Video decode | ~1% | ~0.7 ms | 960×540 |
| Startup + post-processing | ~6% | — | ~16 s per video |

The analysis is **GPU-bound**: the process used ~106 s of CPU in a 242 s run, so the CPU sits idle about half
the time. A faster detector (smaller input, half precision, Core ML / Neural Engine) gives the biggest speed-up.
Tracker, CLIP and decode are not worth optimising.

