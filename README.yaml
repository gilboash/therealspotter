  --nc 4 --train \
  --base-model yolov8m.pt \
  --epochs 20 --imgsz 416 --batch 16 \
  --device mps --name tempdelete \
  --eval-split test --print-paths

# Evaluate (mAP / precision / recall)
python pipeline_sanity_train_eval.py \
  --data-root ./datastuff/fpv_dataset \
  --data-yaml ./fpv_gate.yaml \
