## 🏁 Race day (`race_day_app.py`)

Runs a race day from the director's 2×2 HDMI output (4 pilot feeds, 1080p) with no input after setup. The full plan and results are in `docs/RACE_DAY_PLAN.md`.

```bash
python race_day_app.py
```

- **Live track:**
  - **Setup:** a track name, the number of gates, the channel layout (default R1 R3 / R6 R8) and the capture card.
  - **Recording:** every channel is recorded when its feed is live (not gray, not static). Runs of at least 40 s are saved, video and data. A run ends after 10 s of gray, or 45 s while others in the heat still fly, so a crash doesn't cut it.
  - **Learning:** the track is learned from the first 24 runs.
  - **Results:** after that, every run is labelled (gates, laps) and gets stats. The track is re-learned every 12 runs.
- **Replays:** a learned track plus 2×2 video files are cut into runs, analysed and shown. No learning, no recording.
- **Dashboard:** a read-only web page on the local network (QR code in the app). It has pages for:
  - results and leaderboard;
  - each run (video with gate and lap marks, laps, section grid against the field);
  - heats (synced videos, gap chart);
  - pilots and the track.
- **Analysis:** 4 GPU worker processes, one per channel. Results are identical to the CPU pipeline, 3–4× faster.

