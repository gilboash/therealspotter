## 🎓 Learning a track from videos — no teaching (`learn_track.py`)

Instead of marking every gate in learn_ui, a track can be learned from a few unreviewed videos. You only give the number of gates. The first gate passed in every video is G1 (start/finish).

1. Put the videos in `<track>/learn_videos/`, optionally with `<video>.laps.txt` lap times.
2. `python learn_track.py track1 --gates 13 --evaluate`. A learn video without a run is analysed first, with a blank memory so taught track data can't leak in (about 1.5 min per video). The result is saved as `runs/<video>.learn_passes.json`, never `race_data.json`, so Review and race_ui never load a run without gate labels. A normal `race_data.json` is reused if it exists, because its gate labels are ignored.
3. `python learn_track.py track1 --gates 13 --install` makes the learned memory the track's `gate_memory.json`. The old one is kept as `.bak`.

**How it learns:**
- **A first-lap template:** each video's first lap gives a candidate template, its 13 leg durations, assuming that lap was clean.
- **Refining each candidate on all videos:** each one is refined using timing only. That means labelling with order and timing, then re-estimating each leg's duration with every pilot's speed factored out.
- **Picking the best:** the template that explains all videos best wins, so a first lap with a missed or extra pass can't win.
- **Adding appearance:** timing and gate appearance are then re-learned together, alternating with relabelling until the labels stop changing.
- **Outputs:** `gate_timing.learned.json` (leg durations) and `gate_memory.learned.json` (13 gates, type, and up to 24 varied images each).
- **Six images per gate was too few:** they don't cover other pilots and light. With 24, accuracy went from 97.2% to 98.2%.

**Lap times:** `<video>.laps.txt` next to a learn video holds G1 times, one per line in seconds. A lap-timer clock is shifted automatically to the video. With lap times, every lap holding exactly 13 passes is labelled G1…G13 directly. No template search is needed, and G1 is pinned at those times. Simulated on the reviewed videos, this gave 98.9% (98.6% without).

`gate_decoder.label_race` uses timing from reviewed videos first, then the learned timing, then timing learned from the video itself.

**Result on track1:** learned from 7 unreviewed videos (Q7 ×3, Q8 ×4, 362 passes). Scored on the 13 reviewed videos, which were not used for learning:

| Track knowledge | Gate ID |
|---|---|
| taught (learn_ui memory + timing from reviewed videos) | 98.6% |
| **learned from 7 videos (timing + 24 images per gate)** | **98.2%** (559/569); lap count exact in 12 of 13 videos |
| learned timing, no images at all | 97.9% |
| learned, but only 6 images per gate | 97.2% |

The learned leg durations match the reviewed ones: G5→6 4.74 s vs 4.84 s, G9→10 0.54 s vs 0.55 s. The learned timing alone is as good as the taught timing. The remaining gap is images, and adding more videos to `learn_videos/` adds more.

